name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_new: ${{ steps.ver.outputs.is_new }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract FH_VERSION from src/fh.h
        id: ver
        run: |
          version=$(sed -n 's/^#define FH_VERSION "\(.*\)"/\1/p' src/fh.h)
          if [ -z "$version" ]; then
            echo "FH_VERSION not found in src/fh.h" >&2
            exit 1
          fi
          echo "Detected version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A release is only needed when no tag exists for this version yet
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists, skipping release"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build (${{ matrix.distro }})
    needs: version
    # On main, only build when the version is new; PRs always build to validate
    if: github.event_name == 'pull_request' || needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - distro: alpine
            dockerfile: docker/Dockerfile.alpine
            artifact_name: fh-linux-amd64-musl
          - distro: debian
            dockerfile: docker/Dockerfile.debian
            artifact_name: fh-linux-amd64-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image (${{ matrix.distro }})
        run: docker build -f ${{ matrix.dockerfile }} -t fh-${{ matrix.distro }} .

      - name: Run tests (${{ matrix.distro }})
        run: docker run --rm fh-${{ matrix.distro }} ./run_tests_release.sh

      - name: Extract Binary
        run: |
          id=$(docker create fh-${{ matrix.distro }})
          docker cp $id:/app/fh ${{ matrix.artifact_name }}
          docker rm -v $id

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  build-macos:
    name: Build MacOS
    needs: version
    # On main, only build when the version is new; PRs always build to validate
    if: github.event_name == 'pull_request' || needs.version.outputs.is_new == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: macos-15-intel
          - arch: arm64
            os: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: make -j4 TARGETS=release

      - name: Run Tests
        run: ./run_tests

      - name: Rename Binary
        run: mv fh fh-macos-${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fh-macos-${{ matrix.arch }}
          path: fh-macos-${{ matrix.arch }}

  release:
    name: Create Release
    needs: [version, build-and-test, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fh-*
          merge-multiple: true

      - name: List Artifacts
        run: ls -R

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: fh ${{ needs.version.outputs.version }}
          prerelease: ${{ contains(needs.version.outputs.version, 'rc') }}
          files: |
            fh-linux-amd64-musl
            fh-linux-amd64-gnu
            fh-macos-amd64
            fh-macos-arm64
